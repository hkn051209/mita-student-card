<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>三田高等学校 学生証メーカー</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef1f5;color:#172033;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}
header{background:#142744;color:#fff;padding:18px 16px;text-align:center}
header h1{margin:0 0 4px;font-size:20px}
header p{margin:0;font-size:12px;opacity:.8}
main{max-width:1040px;margin:20px auto;padding:0 14px;display:grid;gap:20px}
.panel{background:#fff;border-radius:16px;padding:18px;box-shadow:0 6px 22px #00000012}
label{display:block;font-weight:700;font-size:13px;margin:12px 0 6px}
input[type=text],input[type=date]{width:100%;padding:11px;border:1px solid #ccd3df;border-radius:9px;font-size:15px;background:#fff}
input[type=file]{width:100%;padding:9px;border:1px solid #ccd3df;border-radius:9px;background:#fff}
button{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}
.primary{background:#142744;color:#fff}
.secondary{background:#e8edf4;color:#142744}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.note{font-size:12px;color:#667085;line-height:1.6}

.preview-wrap{display:flex;justify-content:center}
.card{
 width:min(100%,760px);aspect-ratio:1.586/1;position:relative;overflow:hidden;
 background:#fff;color:#111;border:2px solid #17233a;border-radius:9px;
 box-shadow:0 14px 35px #00000020;
}
.card .navy{position:absolute;left:0;right:0;top:0;height:24%;background:#142744}
.card .divider{position:absolute;left:0;right:0;top:24%;height:4px;background:#e7edf4}
.school{position:absolute;left:5%;top:4.5%;font-size:clamp(20px,3.5vw,32px);font-weight:500;letter-spacing:.10em;color:#fff;z-index:2;white-space:nowrap}
.sub{position:absolute;left:5%;top:13.0%;font-size:clamp(8px,1.35vw,12px);letter-spacing:.15em;color:#fff;z-index:2;white-space:nowrap}
.card-title{position:absolute;right:5%;top:6%;height:11%;border-left:4px solid #fff;padding-left:18px;color:#fff;font-size:clamp(17px,2.5vw,25px);display:flex;align-items:center;z-index:2;white-space:nowrap}
.emblem{position:absolute;right:20.5%;top:2.1%;width:105px;height:105px;object-fit:contain;z-index:3;mix-blend-mode:screen}
.photo{position:absolute;left:5%;top:31%;width:29.5%;height:53%;border:2px solid #b9c4d1;background:#eaf1f8;object-fit:cover;z-index:2}
.info{position:absolute;left:39.5%;top:30.5%;right:5.5%;height:38%;z-index:2;display:flex;flex-direction:column}
.row{flex:1;min-height:0;border-bottom:2px solid #cbd2da;padding:0 0 8px;display:grid;grid-template-columns:23% 77%;align-items:end}
.caption{font-size:clamp(11px,1.5vw,16px);color:#222;letter-spacing:.04em;line-height:1.1;white-space:nowrap}
.value{font-size:clamp(17px,2.8vw,29px);font-weight:600;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cert{position:absolute;left:39.5%;right:5.5%;bottom:12.8%;font-size:clamp(10px,1.35vw,13px);line-height:1.35;color:#222;z-index:2;white-space:normal}
.principal{position:absolute;right:14.5%;bottom:4.2%;font-size:clamp(12px,1.9vw,19px);font-weight:500;color:#222;z-index:2;white-space:nowrap}
.seal{position:absolute;right:5.2%;bottom:3.3%;width:48px;height:48px;border:3px solid #b32626;border-radius:50%;color:#b32626;z-index:3;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;font-weight:800;line-height:1.05;letter-spacing:.02em;transform:rotate(-8deg)}
.seal::before{content:"";position:absolute;inset:4px;border:1px solid #b32626;border-radius:50%}

.crop-tools{display:none;margin-top:12px;padding:12px;border:1px solid #d7dde7;border-radius:12px;background:#f7f9fc}
.crop-tools.active{display:block}
.crop-area{position:relative;width:100%;max-width:360px;aspect-ratio:3/4;margin:0 auto;background:#172744;overflow:hidden;border-radius:8px;touch-action:none}
.crop-area img{position:absolute;left:50%;top:50%;max-width:none;user-select:none;-webkit-user-drag:none;cursor:grab}
.crop-area img.dragging{cursor:grabbing}
.crop-frame{position:absolute;inset:0;border:2px solid #fff;box-shadow:0 0 0 9999px #0005;pointer-events:none}
.crop-controls{margin-top:10px}
.crop-controls label{margin:0;font-size:12px}
.crop-controls input[type=range]{width:100%;padding:0}

@media(max-width:650px){
 .card{border-radius:7px}
 .school{letter-spacing:.04em}
 .sub{letter-spacing:.07em}
 .emblem{width:64px;height:64px;right:21%;top:3.2%}
 .card-title{border-left-width:2px;padding-left:7px}
 .photo{top:31%;height:53%}
 .info{left:39.5%;top:30.5%;height:38%;right:5.5%}
 .row{grid-template-columns:28% 72%;padding-bottom:5px}
 .caption{font-size:clamp(9px,2.1vw,12px);letter-spacing:0}
 .value{font-size:clamp(13px,3.4vw,20px)}
 .cert{left:39.5%;right:5.5%;bottom:12.8%;line-height:1.3}
 .principal{right:16%;bottom:4%;font-size:clamp(9px,2.7vw,15px)}
 .seal{width:34px;height:34px;right:5%;bottom:3.2%;border-width:2px;font-size:7px}
 .seal::before{inset:3px}
}
</style>
</head>
<body>
<header>
<h1>三田高等学校　学生証メーカー</h1>
<p>創作・設定用カード作成ツール</p>
</header>

<main>
<section class="panel">
<h2>① 情報を入力</h2>

<label>顔写真</label>
<input id="photoInput" type="file" accept="image/*">

<div class="crop-tools" id="cropTools">
  <div class="crop-area" id="cropArea">
    <img id="cropImage" alt="写真の切り取り">
    <div class="crop-frame"></div>
  </div>
  <div class="crop-controls">
    <label>拡大・縮小
      <input id="zoomRange" type="range" min="1" max="3" step="0.01" value="1">
    </label>
  </div>
  <p class="note">写真を指でドラッグして位置を調整できます。白い枠の中が学生証に入る範囲です。</p>
  <button class="secondary" id="applyCropBtn" type="button">この切り取りを使用</button>
</div>

<label>氏名</label>
<input id="nameInput" type="text" placeholder="例：三田 太郎">

<label>誕生日</label>
<input id="birthdayInput" type="date">

<label>生徒番号</label>
<input id="idInput" type="text" placeholder="例：25A001">

<div class="actions">
<button class="primary" id="saveBtn" type="button">学生証をPNG保存</button>
<button class="secondary" id="resetBtn" type="button">リセット</button>
</div>

<p class="note">写真はこのページ上で処理され、サーバーへアップロードされません。</p>
</section>

<script>
const $ = id => document.getElementById(id);

function formatBirthday(v) {
  if (!v) return '---';
  const parts = v.split('-');
  if (parts.length !== 3) return '---';
  return Number(parts[1]) + '月' + Number(parts[2]) + '日';
}

function updateText() {
  $('nameOut').textContent = $('nameInput').value.trim() || '---';
  $('birthdayOut').textContent = formatBirthday($('birthdayInput').value);
  $('idOut').textContent = $('idInput').value.trim() || '---';
}
$('nameInput').addEventListener('input', updateText);
$('birthdayInput').addEventListener('input', updateText);
$('idInput').addEventListener('input', updateText);

let currentPhotoUrl = null;
const photoInput = $('photoInput');
const photoPreview = $('photoPreview');
const cropTools = $('cropTools');
const cropArea = $('cropArea');
const cropImage = $('cropImage');
const zoomRange = $('zoomRange');
const applyCropBtn = $('applyCropBtn');

let cropState = {zoom:1,x:0,y:0,baseW:0,baseH:0,dragging:false,sx:0,sy:0};

function drawCropImage() {
  cropImage.style.width = (cropState.baseW * cropState.zoom) + 'px';
  cropImage.style.height = (cropState.baseH * cropState.zoom) + 'px';
  cropImage.style.left = `calc(50% + ${cropState.x}px)`;
  cropImage.style.top = `calc(50% + ${cropState.y}px)`;
  cropImage.style.transform = 'translate(-50%, -50%)';
}

// IMPORTANT: clear on click, not on change.
// This lets the same file be selected again while the browser still shows the selected file.
photoInput.addEventListener('click', () => {
  photoInput.value = '';
});

photoInput.addEventListener('change', () => {
  const file = photoInput.files && photoInput.files[0];
  if (!file) return;

  if (currentPhotoUrl) URL.revokeObjectURL(currentPhotoUrl);
  currentPhotoUrl = URL.createObjectURL(file);

  // Immediate preview.
  photoPreview.src = currentPhotoUrl;

  cropImage.onload = () => {
    const scale = Math.max(
      cropArea.clientWidth / cropImage.naturalWidth,
      cropArea.clientHeight / cropImage.naturalHeight
    );
    cropState.baseW = cropImage.naturalWidth * scale;
    cropState.baseH = cropImage.naturalHeight * scale;
    cropState.zoom = 1;
    cropState.x = 0;
    cropState.y = 0;
    zoomRange.value = '1';
    drawCropImage();
    cropTools.classList.add('active');
  };
  cropImage.src = currentPhotoUrl;
});

zoomRange.addEventListener('input', () => {
  cropState.zoom = Number(zoomRange.value);
  drawCropImage();
});

function startDrag(e) {
  e.preventDefault();
  cropState.dragging = true;
  cropState.sx = e.clientX;
  cropState.sy = e.clientY;
  cropImage.classList.add('dragging');
  cropArea.setPointerCapture?.(e.pointerId);
}
function moveDrag(e) {
  if (!cropState.dragging) return;
  cropState.x += e.clientX - cropState.sx;
  cropState.y += e.clientY - cropState.sy;
  cropState.sx = e.clientX;
  cropState.sy = e.clientY;
  drawCropImage();
}
function endDrag() {
  cropState.dragging = false;
  cropImage.classList.remove('dragging');
}
cropArea.addEventListener('pointerdown', startDrag);
cropArea.addEventListener('pointermove', moveDrag);
cropArea.addEventListener('pointerup', endDrag);
cropArea.addEventListener('pointercancel', endDrag);

applyCropBtn.addEventListener('click', () => {
  if (!cropImage.naturalWidth) return;

  const areaW = cropArea.clientWidth;
  const areaH = cropArea.clientHeight;
  const displayedW = cropState.baseW * cropState.zoom;
  const displayedH = cropState.baseH * cropState.zoom;
  const left = areaW/2 + cropState.x - displayedW/2;
  const top = areaH/2 + cropState.y - displayedH/2;

  const temp = document.createElement('canvas');
  temp.width = Math.max(1, Math.round(displayedW));
  temp.height = Math.max(1, Math.round(displayedH));
  temp.getContext('2d').drawImage(cropImage,0,0,temp.width,temp.height);

  const sx = Math.max(0,-left);
  const sy = Math.max(0,-top);
  const sw = Math.min(areaW, displayedW-sx);
  const sh = Math.min(areaH, displayedH-sy);

  const out = document.createElement('canvas');
  out.width = 600;
  out.height = 760;
  const ctx = out.getContext('2d');
  ctx.fillStyle = '#eaf1f8';
  ctx.fillRect(0,0,out.width,out.height);
  ctx.drawImage(temp,sx,sy,sw,sh,0,0,out.width,out.height);

  photoPreview.src = out.toDataURL('image/jpeg',0.94);
  cropTools.classList.remove('active');
});

$('resetBtn').addEventListener('click', () => {
  if (currentPhotoUrl) URL.revokeObjectURL(currentPhotoUrl);
  location.reload();
});

function roundedRect(ctx,x,y,w,h,r) {
  const rr=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+rr,y);
  ctx.arcTo(x+w,y,x+w,y+h,rr);
  ctx.arcTo(x+w,y+h,x,y+h,rr);
  ctx.arcTo(x,y+h,x,y,rr);
  ctx.arcTo(x,y,x+w,y,rr);
  ctx.closePath();
}

$('saveBtn').addEventListener('click', async () => {
  const card = $('card');
  const rect = card.getBoundingClientRect();
  const scale = 3;
  const W = rect.width, H = rect.height;

  const canvas = document.createElement('canvas');
  canvas.width = Math.round(W*scale);
  canvas.height = Math.round(H*scale);
  const ctx = canvas.getContext('2d');
  ctx.scale(scale,scale);

  // Same geometry as the preview, so the saved PNG matches what is on screen.
  ctx.fillStyle='#fff';
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle='#142744';
  ctx.fillRect(0,0,W,H*0.24);

  ctx.fillStyle='#e7edf4';
  ctx.fillRect(0,H*0.24,W,4);

  ctx.strokeStyle='#17233a';
  ctx.lineWidth=2;
  ctx.strokeRect(1,1,W-2,H-2);

  const text=(s,x,y,size,weight='400',color='#111',align='left') => {
    ctx.fillStyle=color;
    ctx.font=`${weight} ${size}px "Noto Sans JP", "Yu Gothic", system-ui, sans-serif`;
    ctx.textAlign=align;
    ctx.textBaseline='alphabetic';
    ctx.fillText(s,x,y);
  };

  const schoolSize=Math.max(20,W*0.035);
  text('三田高等学校',W*.05,H*.095,schoolSize,'500','#fff');
  text('MITA HIGH SCHOOL',W*.05,H*.145,Math.max(8,W*.0135),'400','#fff');

  ctx.strokeStyle='#fff';
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(W*.805,H*.06);
  ctx.lineTo(W*.805,H*.17);
  ctx.stroke();
  text('学生証',W*.83,H*.125,Math.max(17,W*.025),'500','#fff');

  const emblem=$('emblem');
  if (emblem.complete) ctx.drawImage(emblem,W*.675,H*.021,W*.14,W*.14);

  // Photo: same position/size as preview.
  const px=W*.05, py=H*.31, pw=W*.295, ph=H*.53;
  ctx.fillStyle='#eaf1f8';
  ctx.fillRect(px,py,pw,ph);

  const p=$('photoPreview');
  if (p.src) {
    try {
      await p.decode();
    } catch(e) {}
    if (p.naturalWidth) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(px,py,pw,ph);
      ctx.clip();
      ctx.drawImage(p,px,py,pw,ph);
      ctx.restore();
    }
  }
  ctx.strokeStyle='#b9c4d1';
  ctx.lineWidth=2;
  ctx.strokeRect(px,py,pw,ph);

  // Exact same geometry as the preview.
  const infoLeft=W*.395;
  const infoRight=W*.945;
  const infoTop=H*.305;
  const infoH=H*.38;
  const rowH=infoH/3;
  const capW=(infoRight-infoLeft)*.23;
  const valX=infoLeft+capW;

  const values=[
    ['氏名',$('nameInput').value.trim() || '---'],
    ['誕生日',formatBirthday($('birthdayInput').value)],
    ['生徒番号',$('idInput').value.trim() || '---']
  ];

  values.forEach(([cap,val],i)=>{
    const rowTop=infoTop+i*rowH;
    const baseline=rowTop+rowH-8;
    const capSize=Math.max(10,W*.015);
    const valSize=Math.max(17,W*.028);
    text(cap,infoLeft,baseline,capSize,'400','#222');
    text(val,valX,baseline,valSize,'600','#111');
    ctx.strokeStyle='#cbd2da';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(infoLeft,baseline+8);
    ctx.lineTo(infoRight,baseline+8);
    ctx.stroke();
  });

  // The preview uses the same two-line-safe certificate area.
  const certSize=Math.max(10,W*.0135);
  text('上記の者は、本校の生徒であることを証明します。',infoLeft,H*.835,certSize,'400','#222');

  // Principal name and fictional school seal.
  text('三田高等学校校長',W*.855,H*.942,Math.max(12,W*.019),'500','#222','right');
  const sealX=W*.925, sealY=H*.915, sealR=Math.max(16,W*.032);
  ctx.save();
  ctx.translate(sealX,sealY);
  ctx.rotate(-8*Math.PI/180);
  ctx.strokeStyle='#b32626';
  ctx.lineWidth=Math.max(1.5,W*.0025);
  ctx.beginPath(); ctx.arc(0,0,sealR,0,Math.PI*2); ctx.stroke();
  ctx.lineWidth=Math.max(1,W*.0012);
  ctx.beginPath(); ctx.arc(0,0,sealR-4,0,Math.PI*2); ctx.stroke();
  text('三田',0,-2,Math.max(7,W*.009),'800','#b32626','center');
  text('高等学校',0,7,Math.max(5,W*.0065),'800','#b32626','center');
  ctx.restore();

  const a=document.createElement('a');
  a.download='mita-student-card.png';
  a.href=canvas.toDataURL('image/png');
  a.click();
});
</script>
</body>
</html>
